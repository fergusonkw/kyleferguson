<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kyle Ferguson — Custom Software for Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* nav + footer link styles (depend on tokens) */
  .nav-link {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    color: var(--c-ink-2);
    padding: 8px 14px;
    transition: color .2s ease;
  }
  .nav-link:hover { color: var(--c-ink); }

  .footer-link {
    display: block;
    font-size: 14px;
    color: var(--c-ink-2);
    margin-bottom: 9px;
    transition: color .2s ease;
    width: fit-content;
  }
  .footer-link:hover { color: var(--c-accent); }

  .ledger-row:hover { background: var(--c-surface) !important; }
  .work-card:hover { border-color: var(--c-accent) !important; transform: translateY(-3px); }
  .svc-cell { transition: background .2s ease; }
  .svc-cell:hover { background: var(--c-surface) !important; }

  /* screenshot treatment — quiet by default, activate on attention */
  .media-frame img {
    filter: grayscale(0.85) brightness(0.85) contrast(1.05);
    transition: filter .35s ease;
  }
  .work-card:hover .media-frame img,
  .stacked-row:hover .media-frame img,
  .ledger-row:hover + div .media-frame img,
  .ledger-detail:hover .media-frame img { filter: none; }
  @media (prefers-reduced-motion: reduce) {
    .media-frame img { transition: none; }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1024px) {
    :root { --page-pad: 28px; }
    .hero-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
    .contact-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
    .stack-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 32px !important; }
    .stacked-row { grid-template-columns: 1fr !important; gap: 28px !important; }
    .stacked-row > div:first-child { order: 1 !important; }
    .stacked-row > div:last-child { order: 0 !important; }
  }
  @media (max-width: 720px) {
    .nav-links .nav-link { display: none; }
    .svc-grid { grid-template-columns: 1fr !important; }
    .cards-grid { grid-template-columns: 1fr !important; }
    .stack-grid { grid-template-columns: 1fr !important; }
    .ledger-hide { display: none !important; }
    .ledger-row { grid-template-columns: 44px minmax(0,1fr) 32px !important; }
    .ledger-detail { grid-template-columns: 1fr !important; }
    .contact-grid form > div[style*="grid"] { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="portfolio-shared.jsx"></script>
<script type="text/babel" src="portfolio-sections.jsx"></script>
<script type="text/babel" src="portfolio-contact.jsx"></script>
<script type="text/babel" src="portfolio-work.jsx"></script>
<script type="text/babel" src="portfolio-app.jsx"></script>
</body>
</html>
